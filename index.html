<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Special Day ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    /* DARK LOVELY 2-COLOR BACKGROUND */
    background:
        radial-gradient(circle at 20% 20%, rgba(148,44,104,.45), transparent 40%),
        linear-gradient(135deg,#160b2b,#4b123d);

    color:white;
}


/* ==========================================
   BACKGROUND GLOW
========================================== */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(184,52,121,.15);
    filter:blur(80px);
    top:-180px;
    left:-150px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    background:rgba(91,55,180,.18);
    filter:blur(90px);
    right:-150px;
    bottom:-150px;
    pointer-events:none;
}


/* ==========================================
   FLOATING BALLOONS
========================================== */

.balloon{
    position:absolute;
    width:70px;
    height:90px;
    border-radius:50%;
    opacity:.85;
    animation:float 5s ease-in-out infinite;
    z-index:1;
}

.balloon::before{
    content:"";
    position:absolute;
    width:12px;
    height:10px;
    background:inherit;
    bottom:-5px;
    left:29px;
    clip-path:polygon(0 0,100% 0,50% 100%);
}

.balloon::after{
    content:"";
    position:absolute;
    width:1px;
    height:110px;
    background:rgba(255,255,255,.55);
    left:50%;
    top:88px;
}

.balloon1{
    background:#e94f9b;
    left:7%;
    top:15%;
}

.balloon2{
    background:#7957e8;
    right:9%;
    top:18%;
    animation-delay:1s;
}

.balloon3{
    background:#e7a14c;
    left:15%;
    bottom:8%;
    animation-delay:2s;
}

@keyframes float{

    0%,100%{
        transform:translateY(0) rotate(-3deg);
    }

    50%{
        transform:translateY(-25px) rotate(3deg);
    }

}


/* ==========================================
   UNLOCK CELEBRATION
========================================== */

.celebration-balloon{
    position:fixed;
    bottom:-140px;
    width:65px;
    height:85px;
    border-radius:50%;
    z-index:20;
    animation:balloonRise 3.8s ease-out forwards;
}

.celebration-balloon::before{
    content:"";
    position:absolute;
    width:11px;
    height:9px;
    background:inherit;
    bottom:-4px;
    left:27px;
    clip-path:polygon(0 0,100% 0,50% 100%);
}

.celebration-balloon::after{
    content:"";
    position:absolute;
    width:1px;
    height:100px;
    background:rgba(255,255,255,.7);
    left:50%;
    top:82px;
}

@keyframes balloonRise{

    0%{
        transform:translateY(0) rotate(-5deg);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) rotate(8deg);
        opacity:1;
    }

}


/* ==========================================
   PAPER PARTICLES
========================================== */

.paper{
    position:fixed;
    top:-30px;
    width:10px;
    height:16px;
    z-index:30;
    pointer-events:none;
    animation:paperFall 3.5s linear forwards;
}

@keyframes paperFall{

    0%{
        transform:translateY(-30px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(var(--move))
            rotate(720deg);
        opacity:0;
    }

}


/* ==========================================
   MAIN CARD
========================================== */

.card{
    width:90%;
    max-width:500px;
    padding:45px 35px;
    text-align:center;
    border-radius:30px;

    background:rgba(30,12,38,.72);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.13);

    position:relative;
    z-index:5;
}


/* HEART */

.heart{
    font-size:65px;
    animation:heartbeat 1.5s infinite;
    margin-bottom:15px;

    filter:drop-shadow(0 8px 18px rgba(255,50,130,.35));
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }

}


/* TITLE */

h1{
    font-size:34px;
    color:#ff82b9;
    margin-bottom:12px;

    text-shadow:
        0 5px 25px rgba(255,70,150,.25);
}


/* SUBTITLE */

.subtitle{
    color:#f0dce9;
    font-size:16px;
    line-height:1.7;
    margin-bottom:28px;
}


/* DATE */

.date-box{
    width:100%;
    padding:15px;

    border:2px solid #9e4b78;
    border-radius:15px;

    font-size:17px;
    outline:none;

    background:rgba(255,255,255,.96);
    color:#444;

    margin-bottom:18px;
}

.date-box:focus{
    border-color:#e95a9e;

    box-shadow:
        0 0 0 4px rgba(233,90,158,.15);
}


/* BUTTON */

.unlock-btn{
    width:100%;
    border:none;

    padding:16px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #d6337c,
            #7047d9
        );

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;

    box-shadow:
        0 10px 30px rgba(160,45,120,.25);
}

.unlock-btn:hover{
    transform:translateY(-3px);

    box-shadow:
        0 15px 35px rgba(180,50,130,.35);
}

.unlock-btn:active{
    transform:scale(.97);
}


/* MESSAGE */

.message{
    min-height:28px;
    margin-top:18px;
    font-size:14px;
    font-weight:bold;
}


/* ==========================================
   SUCCESS SCREEN
========================================== */

.success-overlay{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(22,11,43,.96),
            rgba(75,18,61,.96)
        );

    z-index:15;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    pointer-events:none;
}

.success-overlay.show{
    display:flex;
}

.success-text{
    font-size:28px;
    color:white;

    animation:
        successZoom 1.2s ease forwards;

    text-shadow:
        0 5px 30px rgba(255,100,180,.5);
}

@keyframes successZoom{

    0%{
        transform:scale(.5);
        opacity:0;
    }

    60%{
        transform:scale(1.1);
        opacity:1;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px){

    .card{
        width:92%;
        padding:35px 22px;
    }

    h1{
        font-size:28px;
    }

    .heart{
        font-size:55px;
    }

    .subtitle{
        font-size:14px;
    }

    .balloon{
        transform:scale(.7);
    }

    .success-text{
        font-size:23px;
        padding:20px;
    }

}

</style>
</head>


<body>


<!-- BACKGROUND BALLOONS -->

<div class="balloon balloon1"></div>
<div class="balloon balloon2"></div>
<div class="balloon balloon3"></div>


<!-- SUCCESS OVERLAY -->

<div class="success-overlay" id="successOverlay">

    <div class="success-text">
        🎉✨ Memories Unlocked! ✨🎉
        <br><br>
        ❤️ Get ready for our beautiful story ❤️
    </div>

</div>


<!-- MAIN CARD -->

<div class="card">

    <div class="heart">
        ❤️
    </div>

    <h1 id="pageTitle"></h1>

    <div
        class="subtitle"
        id="pageMessage">
    </div>

    <input
        type="date"
        id="anniversaryDate"
        class="date-box"
    >

    <button
        class="unlock-btn"
        onclick="unlockStory()"
        id="unlockButton">
    </button>

    <div
        class="message"
        id="message">
    </div>

</div>


<script>

/* ==========================================
   ❤️ YOUR DATA
   फक्त खालील माहिती बदलायची
========================================== */

const ANNIVERSARY_DATE = "2023-06-11";

const PAGE_TITLE = "Our Special Day ❤️";

const PAGE_MESSAGE =
"A little surprise is waiting for you... ✨<br>" +
"Enter our special anniversary date to unlock our story. 💕";

const BUTTON_TEXT = "🔓 UNLOCK OUR STORY";

const WRONG_DATE =
"💗 Oops! That's not our special date... Try again.";

const CORRECT_DATE =
"🎉 Correct! Opening our memories... ❤️";


/* ==========================================
   PAGE SETTINGS
   खालील code बदलू नका
========================================== */

document.getElementById("pageTitle").innerHTML =
    PAGE_TITLE;

document.getElementById("pageMessage").innerHTML =
    PAGE_MESSAGE;

document.getElementById("unlockButton").innerHTML =
    BUTTON_TEXT;


/* ==========================================
   CREATE BALLOONS
========================================== */

function createCelebrationBalloons(){

    const colors = [
        "#ff4f9a",
        "#8b5cf6",
        "#ffb347",
        "#4dabf7",
        "#f06595",
        "#845ef7",
        "#ffa94d",
        "#20c997"
    ];

    for(let i = 0; i < 14; i++){

        const balloon =
            document.createElement("div");

        balloon.className =
            "celebration-balloon";

        balloon.style.left =
            Math.random() * 100 + "vw";

        balloon.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];

        balloon.style.animationDelay =
            Math.random() * 1.5 + "s";

        balloon.style.animationDuration =
            (3.2 + Math.random() * 2) + "s";

        document.body.appendChild(balloon);

    }

}


/* ==========================================
   CREATE PAPER PARTICLES
========================================== */

function createPaperParticles(){

    const colors = [
        "#ff77aa",
        "#c084fc",
        "#ffd166",
        "#74c0fc",
        "#ffffff",
        "#ff9fba"
    ];

    for(let i = 0; i < 100; i++){

        const paper =
            document.createElement("div");

        paper.className = "paper";

        paper.style.left =
            Math.random() * 100 + "vw";

        paper.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];

        paper.style.width =
            (6 + Math.random() * 7) + "px";

        paper.style.height =
            (10 + Math.random() * 9) + "px";

        paper.style.setProperty(
            "--move",
            (-100 + Math.random() * 200) + "px"
        );

        paper.style.animationDelay =
            Math.random() * .8 + "s";

        paper.style.animationDuration =
            (2.8 + Math.random() * 2) + "s";

        document.body.appendChild(paper);

    }

}


/* ==========================================
   UNLOCK FUNCTION
========================================== */

function unlockStory(){

    const enteredDate =
        document.getElementById("anniversaryDate").value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("unlockButton");

    const overlay =
        document.getElementById("successOverlay");


    /* WRONG DATE */

    if(enteredDate !== ANNIVERSARY_DATE){

        message.style.color =
            "#ff82b9";

        message.innerHTML =
            WRONG_DATE;

        return;
    }


    /* CORRECT DATE */

    message.style.color =
        "#8ff0bd";

    message.innerHTML =
        CORRECT_DATE;

    button.disabled = true;

    button.style.opacity = "0.7";

    /* SHOW CELEBRATION */

    createCelebrationBalloons();

    createPaperParticles();

    overlay.classList.add("show");


    /* OPEN MODULE 2 */

    setTimeout(function(){

        window.location.href =
            "anniversary.html";

    },4000);

}

</script>

</body>
</html>
